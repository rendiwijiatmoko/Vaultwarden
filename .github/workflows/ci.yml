name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .build/bitwarden-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: bitwarden-sdk-arm64-${{ hashFiles('Scripts/prepare-macos-sdk.sh') }}

      - name: Prepare Bitwarden SDK
        env:
          MACOS_ARCHS: arm64
        run: bash Scripts/prepare-macos-sdk.sh

      - name: Build and test
        run: |
          status=0
          xcodebuild test \
            -project vaultwardenApp.xcodeproj \
            -scheme vaultwardenApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= > "$RUNNER_TEMP/ios.log" 2>&1 || status=$?
          grep -E 'error:|✘|failed|\*\* |Test run with' "$RUNNER_TEMP/ios.log" | head -300 || true
          exit $status

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/iOS.xcresult
            ${{ runner.temp }}/ios.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .build/bitwarden-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: bitwarden-sdk-arm64-${{ hashFiles('Scripts/prepare-macos-sdk.sh') }}

      - name: Prepare Bitwarden SDK
        env:
          MACOS_ARCHS: arm64
        run: bash Scripts/prepare-macos-sdk.sh

      - name: Build app and tests
        run: |
          status=0
          xcodebuild build-for-testing \
            -project vaultwardenApp.xcodeproj \
            -scheme vaultwardenApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= > "$RUNNER_TEMP/macos.log" 2>&1 || status=$?
          grep -E 'error:|\*\* ' "$RUNNER_TEMP/macos.log" | head -300 || true
          exit $status

      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-log-${{ github.run_id }}
          path: ${{ runner.temp }}/macos.log
          if-no-files-found: warn
          retention-days: 7
